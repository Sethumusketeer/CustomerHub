<header class="app-header">
  <div class="header-content">

    <a class="brand" routerLink="/dashboard">
      CustomerHub
    </a>

    <nav>
        @if (isAuthenticated) {
          <a routerLink="/dashboard">
            Dashboard
          </a>

          <a routerLink="/customers">
            Customers
          </a>

          @if (isAdmin) {
            <a routerLink="/users">
              Users
            </a>
          }

          <button type="button" (click)="logout()">
            Logout
          </button>
        }
    </nav>

  </div>
</header>
