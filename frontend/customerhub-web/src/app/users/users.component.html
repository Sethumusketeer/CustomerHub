<h2>Users</h2>

<div class="page-header">
    <p>Manage application users</p>

    <button
        type="button"
        class="add-button"
        (click)="openCreateUserModal()">
        + Add User
    </button>
</div>

@if (isLoading) {

    <p>Loading users...</p>

} @else if (users.length > 0) {

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
            </tr>
        </thead>

        <tbody>
            @for (user of users; track user.id) {
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.role }}</td>
                </tr>
            }
        </tbody>
    </table>

} @else {
    <p>No users found.</p>
}

@if (showCreateUserModal) {
    <app-user-create-modal
        (close)="closeCreateUserModal()"
        (userCreated)="loadUsers()">
    </app-user-create-modal>
}
